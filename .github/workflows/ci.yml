name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-browser:
    name: No-browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Run no-browser gates
        run: npm run test:ci:no-browser

  browser-core:
    name: Browser core (${{ matrix.label }})
    runs-on: ubuntu-latest
    # The browsers and their system libraries come in Playwright's image, so a
    # job never waits on the Ubuntu package mirror (apt downloads stalled the
    # browser install past the job's limit). The tag is the lockfile's
    # Playwright version; tests/ci-script-contract-check.mjs holds them equal.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    needs: no-browser
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: chromium
            project: chromium
            shard: "1/1"
            artifact: chromium
          - label: firefox shard 1 of 2
            project: firefox
            shard: "1/2"
            artifact: firefox-1-of-2
          - label: firefox shard 2 of 2
            project: firefox
            shard: "2/2"
            artifact: firefox-2-of-2
          - label: webkit shard 1 of 4
            project: webkit
            shard: "1/4"
            artifact: webkit-1-of-4
          - label: webkit shard 2 of 4
            project: webkit
            shard: "2/4"
            artifact: webkit-2-of-4
          - label: webkit shard 3 of 4
            project: webkit
            shard: "3/4"
            artifact: webkit-3-of-4
          - label: webkit shard 4 of 4
            project: webkit
            shard: "4/4"
            artifact: webkit-4-of-4
          - label: mobile-chrome
            project: mobile-chrome
            shard: "1/1"
            artifact: mobile-chrome
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run core suite for ${{ matrix.project }}
        run: >
          npm run test:browser:core --
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}
          --workers=2

      - uses: actions/upload-artifact@v7
        if: ${{ failure() && hashFiles('test-results/**', 'playwright-report/**') != '' }}
        with:
          name: browser-debug-${{ matrix.artifact }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  browser-evidence:
    name: Browser evidence
    runs-on: ubuntu-latest
    # The browsers and their system libraries come in Playwright's image, so a
    # job never waits on the Ubuntu package mirror (apt downloads stalled the
    # browser install past the job's limit). The tag is the lockfile's
    # Playwright version; tests/ci-script-contract-check.mjs holds them equal.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    needs: no-browser
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Capture and review hosted evidence
        run: npm run test:browser:hosted
        env:
          HOSTED_DEMO_EVIDENCE_DIR: hosted-demo-evidence

      - name: Capture and review visual-audit evidence
        run: npm run test:browser:visual-audit
        env:
          VISUAL_AUDIT_EVIDENCE_DIR: visual-audit-evidence

      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('hosted-demo-evidence/**') != '' }}
        with:
          name: hosted-demo-evidence
          path: hosted-demo-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('visual-audit-evidence/**') != '' }}
        with:
          name: visual-audit-evidence
          path: visual-audit-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: ${{ failure() && hashFiles('test-results/**', 'playwright-report/**') != '' }}
        with:
          name: browser-evidence-debug
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser gates
    if: ${{ always() }}
    needs:
      - browser-core
      - browser-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all browser gates
        env:
          CORE_RESULT: ${{ needs.browser-core.result }}
          EVIDENCE_RESULT: ${{ needs.browser-evidence.result }}
        run: |
          echo "Browser core result: $CORE_RESULT"
          echo "Browser evidence result: $EVIDENCE_RESULT"
          test "$CORE_RESULT" = "success"
          test "$EVIDENCE_RESULT" = "success"

  deploy-pages:
    name: Deploy accepted GitHub Pages build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build explicit static deployment artifact
        run: node scripts/build-pages-artifact.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - name: Deploy accepted commit
        id: deployment
        uses: actions/deploy-pages@v5
