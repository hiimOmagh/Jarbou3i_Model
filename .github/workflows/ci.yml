name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-browser:
    name: No-browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Run no-browser gates
        run: npm run test:ci:no-browser

  browser-core:
    name: Browser core (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: no-browser
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: chromium
            project: chromium
            browser: chromium
            shard: "1/1"
            artifact: chromium
          - label: firefox
            project: firefox
            browser: firefox
            shard: "1/1"
            artifact: firefox
          - label: webkit shard 1 of 2
            project: webkit
            browser: webkit
            shard: "1/2"
            artifact: webkit-1-of-2
          - label: webkit shard 2 of 2
            project: webkit
            browser: webkit
            shard: "2/2"
            artifact: webkit-2-of-2
          - label: mobile-chrome
            project: mobile-chrome
            browser: chromium
            shard: "1/1"
            artifact: mobile-chrome
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run core suite for ${{ matrix.project }}
        run: >
          npm run test:browser:core --
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}
          --workers=2

      - uses: actions/upload-artifact@v5
        if: ${{ failure() && hashFiles('test-results/**', 'playwright-report/**') != '' }}
        with:
          name: browser-debug-${{ matrix.artifact }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  browser-evidence:
    name: Browser evidence
    runs-on: ubuntu-latest
    needs: no-browser
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture and review hosted evidence
        run: npm run test:browser:hosted
        env:
          HOSTED_DEMO_EVIDENCE_DIR: hosted-demo-evidence

      - name: Capture and review visual-audit evidence
        run: npm run test:browser:visual-audit
        env:
          VISUAL_AUDIT_EVIDENCE_DIR: visual-audit-evidence

      - uses: actions/upload-artifact@v5
        if: ${{ always() && hashFiles('hosted-demo-evidence/**') != '' }}
        with:
          name: hosted-demo-evidence
          path: hosted-demo-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: ${{ always() && hashFiles('visual-audit-evidence/**') != '' }}
        with:
          name: visual-audit-evidence
          path: visual-audit-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: ${{ failure() && hashFiles('test-results/**', 'playwright-report/**') != '' }}
        with:
          name: browser-evidence-debug
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser gates
    if: ${{ always() }}
    needs:
      - browser-core
      - browser-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all browser gates
        env:
          CORE_RESULT: ${{ needs.browser-core.result }}
          EVIDENCE_RESULT: ${{ needs.browser-evidence.result }}
        run: |
          echo "Browser core result: $CORE_RESULT"
          echo "Browser evidence result: $EVIDENCE_RESULT"
          test "$CORE_RESULT" = "success"
          test "$EVIDENCE_RESULT" = "success"

  deploy-pages:
    name: Deploy accepted GitHub Pages build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build explicit static deployment artifact
        run: node scripts/build-pages-artifact.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

      - name: Deploy accepted commit
        id: deployment
        uses: actions/deploy-pages@v4
